<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Tafaftire</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background: var(--dark-bg);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background-attachment: fixed;
            color: var(--text-white);
        }

        .login-card {
            background: var(--darkest-bg);
            padding: 35px 40px;
            border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 450px;
            text-align: center;
            border: 1px solid var(--border-color);
        }

        .login-card h2 {
            color: white;
            margin-bottom: 20px;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .form-group label {
            display: block;
            color: var(--text-light-gray);
            margin-bottom: 5px;
            font-size: 0.85rem;
        }

        .form-group input {
            width: 100%;
            padding: 14px;
            background: var(--darker-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: white;
            outline: none;
            transition: 0.3s;
            box-sizing: border-box;
        }

        .form-group input:focus {
            border-color: var(--accent-orange);
            box-shadow: 0 0 10px rgba(144, 202, 249, 0.3);
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: var(--accent-orange);
            border: none;
            border-radius: 12px;
            color: #0A1E3F;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        .login-btn:hover {
            background: var(--accent-orange-dark);
            color: white;
            transform: translateY(-2px);
        }

        .error-msg {
            color: #ff4757;
            font-size: 0.9rem;
            margin-top: 10px;
            display: none;
            font-weight: 600;
        }

        .logo-area {
            margin-bottom: 20px;
        }

        .logo-area i {
            font-size: 3rem;
            color: var(--accent-orange);
        }
    </style>
</head>

<body>
    <div class="login-card">
        <div class="logo-eye" style="display: flex; justify-content: center; align-items: center; gap: 15px; padding: 10px 0; margin-bottom: 15px;">
            <div class="eye-emblem" style="position: relative; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;">
                <i class="fas fa-eye eye-outer" style="font-size: 2.5rem; background: linear-gradient(135deg, var(--accent-orange) 0%, var(--accent-orange-dark) 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 0 15px rgba(255, 159, 28, 0.4));"></i>
                <i class="fas fa-check eye-inner-check" style="position: absolute; font-size: 1.1rem; color: #FFFFFF; background: var(--darkest-bg); border-radius: 50%; padding: 3px; box-shadow: 0 0 20px rgba(255, 255, 255, 0.5); left: 50%; top: 50%; transform: translate(-50%, -50%);"></i>
            </div>
            <div class="logo-text-premium" style="display: flex; flex-direction: column; justify-content: center;">
                <span class="brand-name" style="font-family: 'Outfit', sans-serif; font-size: 1.6rem; font-weight: 900; color: var(--text-white); letter-spacing: 2px; line-height: 1; text-transform: uppercase; margin: 0;">TAFAF<span class="gold" style="background: linear-gradient(to right, var(--accent-orange), var(--accent-orange-dark)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;">TIRE</span></span>
            </div>
        </div>
        <h2>ADMIN AUTH</h2>
        <div class="form-group">
            <label>Username</label>
            <input type="text" id="username" placeholder="Enter ID...">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="Enter Key...">
        </div>
        <button class="login-btn" onclick="login()">CONNECT TO PORTAL</button>
        <div id="error" class="error-msg">Username ama Password waa khalad!</div>
    </div>

    <script>
        async function login() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const errorDiv = document.getElementById('error');

            try {
                const response = await fetch('https://tafaftire-detection-system-scui.onrender.com/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: user, password: pass })
                });

                const data = await response.json();

                if (data.success) {
                    localStorage.setItem('adminToken', data.token);
                    window.location.href = 'Admin.html';
                } else {
                    errorDiv.style.display = 'block';
                    errorDiv.innerText = data.message;
                }
            } catch (err) {
                errorDiv.style.display = 'block';
                errorDiv.innerText = "Ma xirna backend-ka!";
            }
        }
    </script>
</body>

</html>
