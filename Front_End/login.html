<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Tafaftire</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --deep-ocean: linear-gradient(135deg, #0F2027, #203A43, #2C5364);
            --hybrid-gradient: linear-gradient(135deg, #007bff 0%, #ff9f1c 100%);
            --accent-orange: #ff9f1c;
            --text-white: #ffffff;
            --text-gray: #b8c5d6;
        }

        body {
            background: var(--deep-ocean);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Poppins', sans-serif;
            color: var(--text-white);
        }

        .login-card {
            background: rgba(32, 58, 67, 0.4);
            backdrop-filter: blur(20px);
            padding: 50px 40px;
            border-radius: 24px;
            box-shadow: 0 25px 50px rgba(15, 32, 39, 0.7);
            width: 100%;
            max-width: 420px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-card h2 {
            color: #fff;
            margin-bottom: 35px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-size: 1.8rem;
        }

        .form-group {
            margin-bottom: 25px;
            text-align: left;
        }

        .form-group label {
            display: block;
            color: var(--text-gray);
            margin-bottom: 10px;
            font-size: 0.95rem;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 15px 18px;
            background: rgba(15, 32, 39, 0.5);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #fff;
            outline: none;
            transition: 0.3s;
            box-sizing: border-box;
            font-size: 1rem;
        }

        .form-group input:focus {
            border-color: var(--accent-orange);
            background: rgba(15, 32, 39, 0.7);
        }

        .login-btn {
            width: 100%;
            padding: 18px;
            background: var(--hybrid-gradient);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-weight: 800;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            margin-top: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 10px 20px rgba(0, 123, 255, 0.2);
        }

        .login-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(255, 159, 28, 0.3);
            filter: brightness(1.1);
        }

        .error-msg {
            color: #ff5c5c;
            font-size: 0.9rem;
            margin-top: 20px;
            display: none;
            font-weight: 600;
            background: rgba(255, 92, 92, 0.1);
            padding: 12px;
            border-radius: 8px;
        }

        .logo-area {
            margin-bottom: 25px;
        }

        .logo-area i {
            font-size: 4rem;
            background: var(--hybrid-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 10px rgba(255, 159, 28, 0.3));
        }
    </style>
</head>

<body>
    <div class="login-card">
        <div class="logo-area">
            <i class="fas fa-shield-alt"></i>
        </div>
        <h2>Admin Portal</h2>
        <div class="form-group">
            <label>Username</label>
            <input type="text" id="username" placeholder="Enter username">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="Enter password">
        </div>
        <button class="login-btn" onclick="login()">Log In</button>
        <div id="error" class="error-msg">Username ama Password waa khalad!</div>
    </div>

    <script>
        async function login() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const errorDiv = document.getElementById('error');

            const API_BASE_URL = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.protocol === 'file:')
                ? 'http://127.0.0.1:3402'
                : 'https://tafaftire-detection-system.onrender.com';

            try {
                const response = await fetch(`${API_BASE_URL}/api/admin/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: user, password: pass })
                });

                const data = await response.json();

                if (data.success) {
                    localStorage.setItem('adminToken', data.token);
                    window.location.href = 'Admin.html';
                } else {
                    errorDiv.style.display = 'block';
                    errorDiv.innerText = data.message;
                }
            } catch (err) {
                errorDiv.style.display = 'block';
                errorDiv.innerText = "Ma xirna backend-ka!";
            }
        }
    </script>
</body>

</html>
